# Production: GHCR image (API + SPA). PostgreSQL is external.
#
#   cp .env.production.example .env
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# migrate 跑完退出。server 同时托管网页和 /api。健康检查是 GET /health。
# 入口 nginx 把 https://msg.aimo.plus 反代到宿主机 13012。

name: message-center

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-app: &app
  env_file: .env
  environment:
    NODE_ENV: production
  restart: unless-stopped
  logging: *logging
  pull_policy: always

services:
  migrate:
    <<: *app
    image: ghcr.io/ximing/message-center:${MESSAGE_CENTER_IMAGE_TAG:-stable}
    container_name: message-center-migrate
    command: ['node', 'dist/db/migrate.js']
    restart: 'no'

  server:
    <<: *app
    image: ghcr.io/ximing/message-center:${MESSAGE_CENTER_IMAGE_TAG:-stable}
    container_name: message-center
    ports:
      - '13012:3030'
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: '3030'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3030/health").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
