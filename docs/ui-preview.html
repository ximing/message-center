function messageDetail(){const m=messages.find(m=>m.id===selected);if(!m)return `<div class="empty">${icon('inbox')}<p>选择一条消息，查看正文与投递结果。</p></div>`;return `<div class="detail-top"><div class="between"><h2>消息详情</h2><span class="pill">${kindName[m.kind]}</span></div><div class="mono muted" style="margin-top:6px;font-size:10px">${m.id}</div></div><div class="detail-section"><h3>上报信息</h3><dl class="detail-meta"><dt>来源</dt><dd class="row" style="gap:6px">${provider(m.ingress,true)}${providerName(m.ingress)}</dd><dt>发送者</dt><dd class="mono">${esc(m.sender)}</dd><dt>房间</dt><dd>${m.room?`<span class="mono">${esc(m.room)}</span>`:'<span class="muted">无房间</span>'}</dd><dt>上报时间</dt><dd>2026-11-22 ${m.time}</dd></dl><h3 style="margin-top:20px">消息正文</h3><div class="body-preview">${m.body?esc(m.body):`<span class="muted">${kindName[m.kind]}消息仅记录类型，本期未接收文件。</span>`}</div></div><div class="detail-section"><div class="between" style="margin-bottom:18px"><h3 style="margin:0">投递轨迹</h3><span class="muted" style="font-size:10px">${m.deliveries.length} 个目的地</span></div>${m.deliveries.length?m.deliveries.map(d=>{const c=connections.find(c=>c.id===d.connection),r=rules.find(r=>r.id===d.rule);return `<div class="delivery ${d.status}"><div class="delivery-head"><span class="row" style="gap:6px">${provider(c.p,true)}${esc(c.name)}</span>${badge(...statuses[d.status])}</div><p>规则：${esc(r?.name||'历史规则')}${r?.exclusive?' · 独占':''}</p>${d.remote?`<p class="mono">${esc(d.remote)} <span style="float:right">HTTP ${d.http}</span></p>`:''}${d.status==='failed'?`<div class="error-note">令牌已失效，此连接已停止投递。<br><span class="mono">HTTP 401 · UNAUTHORIZED</span></div><button class="text-link" style="font-size:10px;margin-top:7px" onclick="editConnection(${c.id})">更新连接令牌 ${icon('arrow')}</button>`:''}${d.status==='queued'?`<p>已尝试 1 次 · 30 秒后自动重试</p><p class="mono">HTTP 503 · SERVICE_UNAVAILABLE</p>`:''}${d.status==='skipped'?`<p>连接未开启接收${kindName[m.kind]}。</p><p class="mono">media_disabled</p>`:''}${d.status==='pending'?`<p>接收开关已开启，等待后续文件转存能力。</p><p class="mono">media_transport_pending</p>`:''}</div>`}).join(''):`<div class="scope-preview">没有启用的规则匹配这条消息。<br>消息已保存，添加规则只影响后续新消息。</div><button class="text-link" style="margin-top:12px;font-size:11px" onclick="editRule(null,'${m.id}')">为此发送者创建规则 ${icon('arrow')}</button>`}</div><div class="detail-bottom">${icon('lock')} 投递详情不会展示目的地令牌</div>`}
function connectionsPage(){const bad=connections.filter(c=>!c.active);return heading('目的地连接','连接你的收集箱、知识库与笔记，让消息抵达正确的地方。',`<button class="btn primary" onclick="editConnection()">${icon('plus')}添加连接</button>`)+(bad.length?`<div class="notice amber">${icon('alert')}<div><strong>${bad.length} 个连接需要更新令牌</strong><p>${bad.map(c=>esc(c.name)).join('、')}已停止投递，其他连接不受影响。更新令牌后，新消息将恢复投递。</p></div></div>`:'')+`<div class="cards">${connections.map(c=>`<article class="panel connection ${c.active?'':'invalid'}"><div class="connection-head">${provider(c.p)}<div class="grow"><h3>${esc(c.name)}</h3><p>${providerName(c.p)} ${c.p==='inwit'?'文档':c.p==='aimo'?'笔记':'收集箱'}</p></div><button class="icon-btn" aria-label="编辑${esc(c.name)}" onclick="editConnection(${c.id})">${icon('edit')}</button></div>${badge(c.active?'连接正常':'令牌失效',c.active?'green':'red')}<dl class="connection-meta"><dt>对方账号</dt><dd>${esc(c.account)}</dd><dt>服务地址</dt><dd>${esc(c.origin.replace('https://',''))}</dd><dt>令牌预览</dt><dd class="mono">${esc(c.preview)}</dd></dl><div class="connection-options"><label><input type="checkbox" class="switch" aria-label="${esc(c.name)}接收图片" ${c.image?'checked':''} onchange="toggleMedia(${c.id},'image',this.checked)">接收图片</label><label><input type="checkbox" class="switch" aria-label="${esc(c.name)}接收语音" ${c.voice?'checked':''} onchange="toggleMedia(${c.id},'voice',this.checked)">接收语音</label></div><div class="card-bottom"><span class="muted" style="font-size:10px">${rules.filter(r=>r.connection===c.id).length} 条关联规则</span><button class="text-link ${c.active?'':'danger'}" style="font-size:11px" onclick="editConnection(${c.id})">${c.active?'管理连接':'更新令牌'} ${icon('chevron')}</button></div></article>`).join('')}<button class="add-card" onclick="editConnection()"><span>${icon('plus')}</span><strong style="font-size:12px;font-weight:500">添加目的地连接</strong><small>支持 inwit、Vital 和 aimo</small></button></div><div class="help-box">${icon('info')}<div><strong>关于图片和语音</strong><p style="margin-top:4px">开关默认关闭，关闭时投递记为「已跳过」。开启后记为「等待转存」，本期不会上传文件。</p></div></div>`}
function toggleMedia(id,field,value){connections.find(c=>c.id===id)[field]=value;toast(value?'已开启接收；本期仅记录为等待转存':'已关闭接收；新消息的该类投递将跳过')}
function rulesPage(){const list=rules.filter(r=>(ruleFilter==='all'||ruleFilter==='exclusive'&&r.exclusive||ruleFilter==='disabled'&&!r.enabled)&&`${r.name} ${r.sender} ${r.room}`.toLowerCase().includes(ruleSearch.toLowerCase()));return heading('转发规则','用来源、房间和发送者，决定消息的去向。',`<button class="btn" onclick="testRules()">${icon('route')}模拟匹配</button><button class="btn primary" onclick="editRule()">${icon('plus')}新建规则</button>`)+`<div class="notice">${icon('info')}<p>所有匹配的规则都会转发。命中<strong>独占规则</strong>时，只执行命中的独占规则；同一目的地只投递一次。</p></div><section class="panel"><div class="list-head"><div class="between"><h2>我的规则 <span class="count-label">${rules.length} 条</span></h2><span class="muted" style="font-size:11px">${rules.filter(r=>r.enabled).length} 条已启用</span></div><div class="tabs">${[['all','全部规则'],['exclusive','独占规则'],['disabled','已停用']].map(([id,n])=>`<button class="tab ${ruleFilter===id?'active':''}" aria-pressed="${ruleFilter===id}" onclick="ruleFilter='${id}';render()">${n}</button>`).join('')}</div></div><div class="filterbar"><label class="search" style="max-width:310px">${icon('search')}<input id="rule-search" aria-label="搜索规则" placeholder="搜索规则名称、发送者或房间…" value="${esc(ruleSearch)}" oninput="ruleSearch=this.value;updateRulesSearch()"></label></div><div class="table-wrap"><table class="rule-table"><thead><tr><th>规则名称</th><th>匹配条件 <span style="font-size:9px">同时满足</span></th><th>转发至</th><th>启用</th><th></th></tr></thead><tbody>${list.map(r=>{const c=connections.find(c=>c.id===r.connection);return `<tr class="${r.enabled?'':'disabled'}"><td><div class="rule-name">${esc(r.name)}</div><div class="rule-info">${r.exclusive?'<span class="pill blue">独占</span>':'<span>普通转发</span>'}${!c?.active?'<span class="pill red">连接失效</span>':''}</div></td><td><div class="route"><span class="condition">${r.ingress?providerName(r.ingress):'所有来源'}</span>${r.sender||r.room?'<span class="muted">且</span>':''}</div>${r.room?`<div class="subline" style="max-width:none;margin-top:7px">房间 <span class="mono">${esc(r.room)}</span></div>`:''}${r.sender?`<div class="subline" style="max-width:none;margin-top:5px">发送者 <span class="mono">${esc(r.sender)}</span></div>`:''}${!r.sender&&!r.room?'<div class="subline" style="color:var(--amber)">该来源的全部上报</div>':''}</td><td><div class="row">${provider(c.p,true)}<span>${esc(c.name)}</span></div></td><td><input type="checkbox" class="switch" ${r.enabled?'checked':''} aria-label="启用${esc(r.name)}" onchange="toggleRule(${r.id},this.checked)"></td><td><button class="icon-btn" aria-label="编辑${esc(r.name)}" onclick="editRule(${r.id})">${icon('edit')}</button></td></tr>`}).join('')}</tbody></table>${!list.length?'<div class="empty">没有符合条件的规则。</div>':''}</div><div class="table-footer">共 ${list.length} 条规则<span>修改规则仅影响后续新消息</span></div></section><div class="footer-note">${icon('shield')}规则属于当前账号；多个上报密钥共用这套规则。</div>`}
function updateRulesSearch(){const el=document.querySelector('#rule-search'),pos=el.selectionStart;render();const next=document.querySelector('#rule-search');next.focus();next.setSelectionRange(pos,pos)}
function toggleRule(id,value){rules.find(r=>r.id===id).enabled=value;render();toast(value?'规则已启用':'规则已停用')}
function keysPage(){return heading('接入密钥','为微信模块和 Webhook 创建凭证，统一接收你的消息。',`<button class="btn primary" onclick="editKey()">${icon('plus')}创建密钥</button>`)+`<div class="intro-grid">${[['wechat','微信模块','配置消息中心地址和密钥，上报收到的消息。','/api/v1/ingest/wechat'],['webhook','Webhook','用同一套账号密钥，接入外部服务与自动化。','/api/v1/ingest/webhook']].map(([p,n,d,u])=>`<div class="panel ingress-card">${provider(p)}<div class="grow"><h3>${n}</h3><p>${d}</p><div class="endpoint"><b>POST</b><span class="mono grow">${u}</span><button class="icon-btn" style="height:22px;width:22px" aria-label="复制${n}接口路径" onclick="copyText('${u}')">${icon('copy')}</button></div></div></div>`).join('')}</div><section class="panel"><div class="section-title between"><h2>账号密钥 <span class="count-label">${keys.filter(k=>!k.revoked).length} / 20 把有效</span></h2><button class="text-link" style="font-size:11px" onclick="guide()">查看接入指南 ${icon('arrow-up')}</button></div><div class="table-wrap"><table class="key-table"><thead><tr><th>密钥名称 / 备注</th><th>密钥预览</th><th>最近使用</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${keys.map(k=>`<tr style="${k.revoked?'opacity:.5':''}"><td><strong style="font-weight:500">${esc(k.name)}</strong>${k.revoked?' <span class="pill">已吊销</span>':''}<div class="subline" style="max-width:none">${esc(k.note||'无备注')}</div></td><td class="mono">${esc(k.token.slice(0,8))}…${esc(k.token.slice(-4))}</td><td class="time">${esc(k.used)}</td><td class="time">${k.date}</td><td class="actions"><button class="text-link" ${k.revoked?'disabled':''} onclick="revealKey(${k.id})">显示</button><button class="text-link" ${k.revoked?'disabled':''} onclick="editKey(${k.id})">编辑</button><button class="text-link danger" ${k.revoked?'disabled':''} onclick="revokeKey(${k.id})">吊销</button></td></tr>`).join('')}</tbody></table></div></section><div class="help-box">${icon('shield')}<div><strong>一套密钥，两个上报渠道</strong><p style="margin-top:4px">每把 mck_ 密钥都可以用于微信和 Webhook，也可以分别创建以便管理。密钥只能上报消息，不能读取消息或修改规则。</p></div></div>`}
let focusBeforeDialog;
function openDrawer(title,body,footer=''){const d=document.querySelector('#drawer');if(!d.open)focusBeforeDialog=document.activeElement;d.innerHTML=`<div class="dialog-head"><h2 id="drawer-title">${title}</h2><button class="icon-btn" onclick="closeDrawer()" aria-label="关闭抽屉">${icon('close')}</button></div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-foot">${footer}</div>`:''}`;if(!d.open)d.showModal()}
function closeDrawer(){document.querySelector('#drawer').close();focusBeforeDialog?.isConnected&&focusBeforeDialog.focus()}
function cancelButton(){return '<button class="btn" type="button" onclick="closeDrawer()">取消</button>'}
function field(label,name,value='',placeholder='',type='text',extra=''){return `<label class="field"><span>${label}</span><input name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${extra}></label>`}
function editRule(id=null,messageId=null){const m=messages.find(m=>m.id===messageId),r=rules.find(r=>r.id===id)||{name:'',ingress:m?.ingress||'',room:'',sender:m?.sender||'',connection:connections.find(c=>c.active)?.id,enabled:true,exclusive:false};openDrawer(id?'编辑转发规则':'新建转发规则',`<form id="rule-form" onsubmit="saveRule(event,${id})">${field('规则名称','name',r.name,'例如：个人消息收集','text','required maxlength="60"')}<div class="field-group"><h3>当消息同时满足以下条件</h3><label class="field"><span>上报渠道</span><select name="ingress" onchange="updateScope()"><option value="">不限渠道</option>${['wechat','webhook'].map(p=>`<option value="${p}" ${r.ingress===p?'selected':''}>${providerName(p)}</option>`).join('')}</select></label>${field('房间 <span class="optional">可选</span>','room',r.room,'输入完整房间 ID','text','oninput="updateScope()"')}${field('发送者 <span class="optional">可选</span>','sender',r.sender,'输入完整发送者 ID','text','oninput="updateScope()"')}<small class="muted">留空表示不限；房间和发送者都填写时，必须同时匹配。</small></div><label class="field"><span>转发到</span><select name="connection" required>${connections.map(c=>`<option value="${c.id}" ${c.id===r.connection?'selected':''}>${esc(c.name)} / ${providerName(c.p)}${c.active?'':'（令牌失效）'}</option>`).join('')}</select></label><div class="check-setting"><div><h3>独占规则</h3><p>命中后仅执行独占规则，忽略普通规则。</p></div><input class="switch" type="checkbox" name="exclusive" aria-label="独占规则" ${r.exclusive?'checked':''} onchange="updateScope()"></div><div class="check-setting" style="margin-bottom:20px"><div><h3>启用规则</h3><p>保存后对新上报的消息生效。</p></div><input class="switch" type="checkbox" name="enabled" aria-label="启用规则" ${r.enabled?'checked':''}></div><div id="scope" class="scope-preview"></div></form>`,`${id?`<button class="text-link danger" style="margin-right:auto" onclick="deleteRule(${id})">删除规则</button>`:''}${cancelButton()}<button class="btn primary" type="submit" form="rule-form">保存规则</button>`);updateScope()}
function updateScope(){const f=document.querySelector('#rule-form'),data=new FormData(f),all=!data.get('room').trim()&&!data.get('sender').trim(),scope=document.querySelector('#scope');scope.className='scope-preview'+(all?' warn':'');scope.textContent=all?`匹配范围较广：将匹配${data.get('ingress')?providerName(data.get('ingress')):'微信和 Webhook'}的全部上报。`:'仅转发同时满足上述条件的新消息。';if(data.get('exclusive'))scope.textContent+=' 命中后，普通规则不再执行。'}
function saveRule(e,id){e.preventDefault();const d=new FormData(e.target);if(!d.get('name').trim()){e.target.elements.name.setCustomValidity('请输入规则名称');e.target.elements.name.reportValidity();e.target.elements.name.setCustomValidity('');return}const r={id:id||Date.now(),name:d.get('name').trim(),ingress:d.get('ingress'),room:d.get('room').trim(),sender:d.get('sender').trim(),connection:Number(d.get('connection')),enabled:!!d.get('enabled'),exclusive:!!d.get('exclusive')};if(id)rules[rules.findIndex(r=>r.id===id)]=r;else rules.push(r);closeDrawer();render();toast('规则已保存，仅影响后续新消息')}
function confirmAction(title,body,label,action){const d=document.querySelector('#confirm');d.innerHTML=`<div class="dialog-head"><h2 id="confirm-title">${esc(title)}</h2><button class="icon-btn" onclick="document.querySelector('#confirm').close()" aria-label="取消">${icon('close')}</button></div><div class="dialog-body"><p style="color:#7b869b;line-height:1.9">${body}</p></div><div class="dialog-foot"><button class="btn" onclick="document.querySelector('#confirm').close()">取消</button><button class="btn danger" id="confirm-action">${esc(label)}</button></div>`;d.querySelector('#confirm-action').onclick=()=>{d.close();action()};d.showModal()}
function deleteRule(id){const r=rules.find(r=>r.id===id);confirmAction('删除这条规则？',`「${esc(r.name)}」删除后，新消息将不再通过这条规则转发。历史投递记录会保留。`,'删除规则',()=>{rules=rules.filter(r=>r.id!==id);closeDrawer();render();toast('规则已删除')})}
function editConnection(id=null){const c=connections.find(c=>c.id===id)||{name:'',p:'vital',origin:'https://vital.aimo.plus',image:false,voice:false};openDrawer(id?'管理目的地连接':'添加目的地连接',`<div class="notice" style="font-size:11px">${icon('info')}<p>当前为交互演示，不会连接外部服务。请使用示例令牌，不要输入真实凭证。</p></div><form id="connection-form" onsubmit="saveConnection(event,${id})"><label class="field"><span>目的地渠道</span><select name="provider" ${id?'disabled':''} onchange="changeProvider(this.value)">${['vital','inwit','aimo'].map(p=>`<option value="${p}" ${c.p===p?'selected':''}>${providerName(p)}</option>`).join('')}</select></label>${field('显示名称','name',c.name,'例如：我的知识库','text','required maxlength="60"')}${field('服务地址','origin',c.origin,'https://vital.aimo.plus','url','required')}${field(id?'更新访问令牌 <span class="optional">不修改可留空</span>':'访问令牌','token','','粘贴对应渠道的令牌','password',id?'autocomplete="off"':'required autocomplete="off"')}<button class="text-link" type="button" style="font-size:11px;margin-top:-9px;margin-bottom:20px" onclick="useDemoToken()">填入示例令牌</button><div class="field-group"><h3>媒体接收设置</h3><div class="check-setting"><span>接收图片</span><input type="checkbox" name="image" class="switch" aria-label="接收图片" ${c.image?'checked':''}></div><div class="check-setting"><span>接收语音</span><input type="checkbox" name="voice" class="switch" aria-label="接收语音" ${c.voice?'checked':''}></div><p class="muted" style="font-size:11px;margin-top:14px">开启后仅记录为「等待转存」，本期不上传文件。</p></div><div id="connection-error" class="field-error" role="alert"></div><p class="muted" style="font-size:11px">正式接入时，将先验证令牌并读取对方账号，成功后才保存。目的地令牌不回显。</p></form>`,`${cancelButton()}<button class="btn primary" type="submit" form="connection-form">${id?'保存连接':'验证并保存'}</button>`)}
const origins={vital:'https://vital.aimo.plus',inwit:'https://inwit.aimo.plus',aimo:'https://aimo.plus'},prefixes={vital:'vt_',inwit:'iwt_',aimo:'aimo_tk_'};
function changeProvider(p){document.querySelector('#connection-form [name=origin]').value=origins[p];document.querySelector('#connection-form [name=token]').value=''}
function useDemoToken(){const f=document.querySelector('#connection-form');f.elements.token.value=prefixes[f.elements.provider.value]+'demo_only_not_valid_1234'}
function saveConnection(e,id){e.preventDefault();const f=e.target,d=new FormData(f),old=connections.find(c=>c.id===id),p=old?.p||d.get('provider'),token=d.get('token').trim(),err=document.querySelector('#connection-error');let u;try{u=new URL(d.get('origin'));if(u.protocol!=='https:'||u.pathname!=='/'||u.search||u.hash||u.username||u.password)throw Error()}catch{err.textContent='请输入不含路径、参数或账号信息的 HTTPS 服务地址。';return}if(!d.get('name').trim()){err.textContent='请输入连接名称。';return}if(token&&!token.startsWith(prefixes[p])){err.textContent=`${providerName(p)} 令牌必须以 ${prefixes[p]} 开头。`;return}const c={id:id||Date.now(),p,name:d.get('name').trim(),account:old?.account||'演示账号',origin:u.origin,preview:token?token.slice(0,8)+'…'+token.slice(-4):old?.preview,active:token?true:old?.active??true,image:!!d.get('image'),voice:!!d.get('voice')};if(id)connections[connections.findIndex(c=>c.id===id)]=c;else connections.push(c);closeDrawer();render();toast(token?'已模拟验证并保存连接；未请求外部服务':'连接设置已保存')}
function editKey(id=null){const k=keys.find(k=>k.id===id)||{name:'',note:''};if(!id&&keys.filter(k=>!k.revoked).length>=20){toast('有效密钥已达 20 把，请先吊销不再使用的密钥');return}openDrawer(id?'编辑接入密钥':'创建接入密钥',`<p class="muted" style="font-size:12px;margin-bottom:25px">用名称和备注区分设备或调用方。每把密钥均可用于微信与 Webhook。</p><form id="key-form" onsubmit="saveKey(event,${id})">${field('密钥名称','name',k.name,'例如：主力手机','text','required maxlength="60"')}<label class="field"><span>备注 <span class="optional">可选</span></span><textarea name="note" placeholder="这把密钥用在哪里？" maxlength="200">${esc(k.note)}</textarea></label></form><div class="notice">${icon('shield')}<p>密钥仅有上报权限。登录后可以再次显示或吊销，不绑定具体微信身份和渠道。</p></div>`,`${cancelButton()}<button class="btn primary" type="submit" form="key-form">${id?'保存修改':'创建密钥'}</button>`)}
function saveKey(e,id){e.preventDefault();const d=new FormData(e.target);if(!d.get('name').trim()){toast('请输入密钥名称');return}if(id){const k=keys.find(k=>k.id===id);k.name=d.get('name').trim();k.note=d.get('note').trim();closeDrawer();render();toast('密钥信息已保存')}else{const k={id:Date.now(),name:d.get('name').trim(),note:d.get('note').trim(),token:'mck_demo_only_'+Math.random().toString(36).slice(2)+'_1234',used:'尚未使用',date:'2026-11-22',revoked:false};keys.push(k);render();revealKey(k.id,true)}}
function revealKey(id,created=false){const k=keys.find(k=>k.id===id);openDrawer(created?'密钥已创建':'显示完整密钥',`<h3>${esc(k.name)}</h3><p class="muted" style="font-size:12px;margin-top:8px">${created?'复制后填入微信模块或 Webhook 调用方。':'关闭后会重新隐藏完整密钥。'}</p><div class="token-display mono">${esc(k.token)}</div><button class="btn" onclick="copyText(keys.find(k=>k.id===${id}).token)">${icon('copy')}复制密钥</button><div class="notice amber" style="margin-top:24px">${icon('info')}<p>这是设计稿中的示例密钥，不能用于真实上报。</p></div>`,`<button class="btn primary" onclick="closeDrawer()">完成</button>`)}
function revokeKey(id){const k=keys.find(k=>k.id===id);confirmAction('吊销这把密钥？',`使用「${esc(k.name)}」的微信模块和 Webhook 将立即无法上报，其他密钥不受影响。吊销无法撤销；微信模块需更换密钥并重新打包。`,'确认吊销',()=>{k.revoked=true;render();toast('密钥已吊销')})}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('已复制')}catch{openDrawer('复制内容',`<p class="muted">浏览器暂不允许自动复制，请选中下方内容手动复制。</p><textarea readonly style="width:100%;margin-top:18px">${esc(text)}</textarea>`,`<button class="btn primary" onclick="closeDrawer()">完成</button>`);document.querySelector('#drawer textarea').select()}}
function guide(){openDrawer('接入指南',`<div class="stack"><div><h3>1. 创建账号密钥</h3><p class="muted" style="margin-top:7px">在接入密钥页面生成 mck_ 密钥。同一把密钥可用于两个上报渠道。</p></div><div><h3>2. 配置消息上报</h3><p class="muted" style="margin:9px 0">微信模块的打包配置：</p><pre class="body-preview mono">MESSAGE_CENTER_URL=https://your-message-center.example
MESSAGE_CENTER_APP_KEY=mck_...</pre><p class="muted" style="margin:15px 0 9px">Webhook 请求示例：</p><pre class="body-preview mono">POST /api/v1/ingest/webhook
Authorization: Bearer mck_...
Content-Type: application/json

{
  "eventId": "unique-event-001",
  "kind": "text",
  "sender": "browser-clipper",
  "text": "一条值得保存的消息"
}</pre><p class="muted" style="font-size:11px;margin-top:9px">eventId 在当前账号下必须唯一；重复上报不会新增投递。</p></div><div><h3>3. 添加目的地与规则</h3><p class="muted" style="margin-top:7px">先验证目的地连接，再配置匹配条件。没有规则命中的消息会保留为「未匹配」。</p></div></div>`,`<button class="btn primary" onclick="closeDrawer()">知道了</button>`)}
function testRules(){openDrawer('模拟规则匹配',`<p class="muted" style="margin-bottom:22px">选择一条示例消息，查看当前规则将产生的投递，不会重新发送消息。</p><label class="field"><span>示例消息</span><select id="test-message" onchange="renderTestResult()">${messages.map(m=>`<option value="${m.id}">${m.time} · ${esc(m.alias)}${m.room?' · 群消息':''} · ${kindName[m.kind]}</option>`).join('')}</select></label><div id="test-result"></div>`,`<button class="btn primary" onclick="closeDrawer()">完成</button>`);renderTestResult()}
function renderTestResult(){const m=messages.find(m=>m.id===document.querySelector('#test-message').value),hit=rules.filter(r=>r.enabled&&(!r.ingress||r.ingress===m.ingress)&&(!r.room||r.room===m.room)&&(!r.sender||r.sender===m.sender)),exclusive=hit.some(r=>r.exclusive),kept=exclusive?hit.filter(r=>r.exclusive):hit,unique=[...new Set(kept.map(r=>r.connection))];document.querySelector('#test-result').innerHTML=`<div class="scope-preview">匹配 ${hit.length} 条规则，产生 ${unique.length} 个目的地的投递。${exclusive?'已命中独占规则，忽略普通规则。':''}</div><div class="stack" style="margin-top:23px">${hit.map(r=>{const c=connections.find(c=>c.id===r.connection),ignored=exclusive&&!r.exclusive;return `<div style="padding:14px;border:1px solid var(--line);border-radius:8px;${ignored?'opacity:.5':''}"><div class="between"><h3>${esc(r.name)}</h3>${badge(ignored?'被独占规则排除':r.exclusive?'独占命中':'已命中',ignored?'':'blue')}</div><div class="row" style="margin-top:10px;font-size:12px">${provider(c.p,true)}${esc(c.name)}</div>${!ignored?`<p class="muted" style="font-size:11px;margin-top:9px">${!c.active?'连接令牌已失效，无法完成投递。':['image','voice'].includes(m.kind)?c[m.kind]?'等待转存：本期不上传文件。':'已跳过：连接未开启该媒体类型。':'进入转发队列。'}</p>`:''}</div>`}).join('')||'<div class="empty" style="padding:25px">没有匹配规则，消息将保留为未匹配。</div>'}</div><p class="muted" style="font-size:11px;margin-top:20px">多条规则命中同一连接时，只生成一条投递。</p>`}
function loginPage(){return `<div class="login-layout"><section class="login-art"><div class="brand-symbol" style="margin-bottom:30px;width:42px;height:42px">${icon('brand')}</div><h1>接住每条消息，<br>送往你的世界。</h1><p>从微信到 Webhook，把零散的信息交给规则，统一收集到你的知识库和笔记。</p><div class="login-map"><div class="stack"><div class="map-box">${provider('wechat',true)}微信</div><div class="map-box">${provider('webhook',true)}Webhook</div></div><span class="muted">${icon('arrow')}</span><div class="brand-symbol" style="flex-shrink:0;width:45px;height:45px">${icon('brand')}</div><span class="muted">${icon('arrow')}</span><div class="stack">${['vital','inwit','aimo'].map(p=>`<div class="map-box">${provider(p,true)}${providerName(p)}</div>`).join('')}</div></div><p style="font-size:11px;margin-bottom:0">你的账号 · 你的连接 · 你的规则</p></section><section class="login-form-wrap"><div class="login-form"><h2>${loginMode==='login'?'欢迎回来':'创建你的账号'}</h2><p>${loginMode==='login'?'登录消息中心，继续整理你的信息流。':'用一套规则，连接你的消息与知识。'}</p><form onsubmit="demoLogin(event)">${field('邮箱','email','','you@example.com','email','required autocomplete="username"')}${field('密码','password','','至少 8 位字符','password',`required minlength="8" autocomplete="${loginMode==='login'?'current-password':'new-password'}"`)}<button class="btn primary" type="submit">${loginMode==='login'?'登录':'注册并登录'}</button></form>${showOidc?`<div class="divider">或</div><button class="btn" onclick="demoOidc()">${icon('shield')}使用统一账号登录</button>`:''}<div class="login-toggle">${loginMode==='login'?'还没有账号？':'已有账号？'} <button class="text-link" onclick="loginMode=loginMode==='login'?'register':'login';render()">${loginMode==='login'?'创建账号':'前往登录'}</button></div><div style="border-top:1px solid var(--line);margin-top:35px;padding-top:17px;font-size:10px;color:#9aa3b5"><label class="row"><input type="checkbox" ${showOidc?'checked':''} onchange="showOidc=this.checked;render()">演示：统一账号已配置</label><p style="margin-top:9px">此页为交互预览，不会发送或保存登录凭证。</p><button class="text-link" style="font-size:10px;margin-top:10px" onclick="location.hash='messages'">返回控制台预览</button></div></div></section></div>`}
function demoLogin(e){e.preventDefault();e.target.reset();location.hash='messages';toast('已进入控制台预览，未执行真实登录')}
function demoOidc(){location.hash='messages';toast('统一账号登录流程演示完成，未连接身份服务')}
document.querySelector('#drawer').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left)closeDrawer()}});
navigate();icons();
</script>
</body>
</html>
